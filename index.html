<!DOCTYPE html>
<html lang="id">

<head>

  <meta name="description"
    content="Modul Pembelajaran Interaktif Modus Penyelundupan Narkotika untuk Pegawai Direktorat Jenderal Bea dan Cukai (DJBC) - Kemenkeu RI">
  <link rel="stylesheet" href="./src/styles/index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"

      <div class="sidebar-header">

        <div class="sidebar-title-group">

        </div>

      <nav class="sidebar-nav">
        <a href="#/beranda" class="nav-item active" data-route="beranda">

          </svg>
          <span class="nav-label">Beranda & Panduan</span>

        <div class="sidebar-category-header"
          style="margin-top: 16px; padding: 0 16px; font-size: 11px; font-weight: 700; color: var(--color-on-primary-container); text-transform: uppercase; letter-spacing: 0.08em;">

        <a href="#/modul1" class="nav-item" data-route="modul1">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">

            <path

          <span class="nav-label">3. Barang Kiriman</span>
        </a>

        <a href="#/modul4a" class="nav-item" data-route="modul4a">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z" />

          <span class="nav-label">4A. Kendaraan (SUV)</span>

          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path

          <span class="nav-label">4B. Kapal Laut Cargo</span>

        <div class="sidebar-category-header"
          style="margin-top: 16px; padding: 0 16px; font-size: 11px; font-weight: 700; color: var(--color-on-primary-container); text-transform: uppercase; letter-spacing: 0.08em;">
          EVALUASI
        </div>

        <a href="#/evaluasi" class="nav-item" data-route="evaluasi">

            <path
              d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z" />

          <span class="nav-label">Ujian Evaluasi</span>

      <div class="sidebar-footer">
        <div class="customs-badge-card">
          <img src="assets/mockup/sidebar_customs_bg.png" alt="Customs Border Protection" class="customs-footer-img" />
          <div class="customs-caption">
            <!-- <span class="cbp-title">CUSTOMS BORDER PROTECTION</span> -->
            <!-- <span class="cbp-sub">Mengawasi • Melindungi • Melayani</span> -->
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main id="main-wrapper">
      <!-- Clean Top Header -->
      <header id="main-header">
        <div class="header-left">
          <button id="sidebar-toggle-btn" class="btn-icon" title="Toggle Sidebar">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
              <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
            </svg>
          </button>
          <div class="breadcrumb">
            <span id="page-title" class="active-page">Beranda & Panduan</span>
          </div>
        </div>

        <div style="display: flex; align-items: center; gap: 16px;">
          <!-- LRS Connection Config Button -->
          <button id="lrs-config-btn" class="btn-icon" title="Pengaturan LRS / xAPI Analytics"
            style="position: relative;">
            ⚙️
            <span id="lrs-status-dot"
              style="position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: #64748B;"></span>
          </button>

          <!-- KLC User Profile Widget -->
          <div id="user-profile-widget">
            <div class="user-avatar-container">
              <img id="user-avatar-img" src="" alt="Avatar" style="display: none;">
              <span id="user-avatar-placeholder" style="display: none;">👤</span>
              <span id="user-avatar-initials">BC</span>
            </div>
            <div class="user-info-text">
              <span id="user-display-name">Memuat profil...</span>
              <span id="user-display-role">Pegawai DJBC</span>
            </div>
          </div>
        </div>
      </header>

      <!-- Viewport Content Render Area -->
      <div id="content-area">
        <!-- Dynamic module pages render here -->
      </div>
    </main>

    <!-- Modal Container Root -->
    <div id="modal-root"></div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>

</html>
